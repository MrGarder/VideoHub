<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>VideoHub — Просмотр</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="uploads/IMG_5231.PNG">

  <style>
    :root{
      --bg1: #1e1e2f;
      --glass: rgba(255,255,255,0.04);
      --text: #fff;
      --accent: linear-gradient(135deg, #6b5cff, #8b5cf6);
      --accent-solid: #6b5cff;
      --muted: rgba(255,255,255,0.7);
    }
    html,body{height:100%;margin:0;font-family:Inter, Arial, sans-serif;background: linear-gradient(135deg,#11111a,#1b1630);color:var(--text);-webkit-font-smoothing:antialiased}
    
    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      cursor: pointer;
      background: linear-gradient(135deg, #fff 30%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo span { color: #8b5cf6; -webkit-text-fill-color: #8b5cf6; }

    .topbar{display:flex;align-items:center;justify-content: space-between;padding:12px 20px;background:var(--glass);border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:20;backdrop-filter: blur(10px);}
    .topbar-left { display: flex; align-items: center; gap: 12px; }

    .back-btn {
      background: rgba(140,70,255,.15); border: 1px solid rgba(140,70,255,.3);
      color: #dcd1ff; padding: 6px 14px; margin-right: 12px; border-radius: 10px;
      font-size: 14px; cursor: pointer; transition: .25s;
    }
    .back-btn:hover { background: rgba(140,70,255,.3); }

    .noti-wrapper { position: relative; cursor: pointer; }
    #notiBtn { background: none; border: none; font-size: 20px; color: var(--text); cursor: pointer; position: relative; }
    #notiCount { position: absolute; top: -5px; right: -5px; background: #ff4e4e; color: white; font-size: 10px; padding: 2px 5px; border-radius: 50%; display: none; }
    .noti-dropdown { 
        position: absolute; top: 40px; right: 0; width: 280px; background: #252538; 
        border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: none; 
        max-height: 400px; overflow-y: auto; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .noti-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; transition: 0.2s; }
    .noti-item:hover { background: rgba(255,255,255,0.05); }
    .noti-item.unread { border-left: 3px solid #8b5cf6; background: rgba(107, 92, 255, 0.05); }

    .container{display:flex;gap:24px;padding:20px;max-width:1400px;margin:0 auto}
    .player-column{flex:2.5;min-width:0}
    
    .side-column{
        flex: 1;
        max-width: 400px;
        background: rgba(255,255,255,0.02);
        border-radius: 16px;
        padding: 16px;
        border: 1px solid rgba(255,255,255,0.05);
        height: fit-content;
        position: sticky;
        top: 85px;
    }
    #recommendedList {
        max-height: 75vh;
        overflow-y: auto;
        padding-right: 4px;
    }
    #recommendedList::-webkit-scrollbar { width: 4px; }
    #recommendedList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

    video{width:100%;border-radius:16px;background:black; aspect-ratio: 16/9; outline: none; box-shadow: 0 20px 50px rgba(0,0,0,0.6);}
    .title{margin-top:16px;font-size:24px;font-weight:700}

    .video-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.08)}
    .channel-left{display:flex;gap:12px;align-items:center;min-width:0; cursor: pointer;}
    
    .avatar{
        width:44px; height:44px; border-radius:50%; 
        background:linear-gradient(135deg,#8b5cf6,#5143ff); 
        flex-shrink:0; display: flex; align-items: center; justify-content: center; 
        font-weight: bold; font-size: 18px; 
        background-size: cover; background-position: center;
        border: 1px solid rgba(255,255,255,0.1);
    }

    .channel-info{min-width:0}
    .channel-info .name{font-weight:700;font-size:16px;}
  </style>
</head>
<body>
  </body>
</html>
