<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>VideoHub — Просмотр</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --bg1: #0f0f1a; --accent: #8b5cf6; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg1); color: white; }
    .topbar { display: flex; align-items: center; padding: 15px 20px; background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); }
    .container { display: flex; gap: 24px; padding: 20px; max-width: 1400px; margin: auto; }
    .player-column { flex: 2.5; }
    #player-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
    .side-column { flex: 1; }
    .side-card { display: flex; gap: 10px; margin-bottom: 12px; cursor: pointer; padding: 5px; border-radius: 8px; }
    .side-card:hover { background: rgba(255,255,255,0.05); }
    .side-thumb { width: 120px; height: 68px; background: #222; border-radius: 8px; object-fit: cover; }
    .comment-item { margin: 15px 0; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 10px; }
  </style>
</head>
<body>

<div class="topbar">
    <button onclick="history.back()" style="background:none; border:none; color:white; cursor:pointer;">← Назад</button>
    <div style="font-size:22px; font-weight:bold; margin-left:20px;">Video<span style="color:var(--accent);">Hub</span></div>
</div>

<div class="container">
    <div class="player-column">
        <div id="player-container"></div>
        <h2 id="videoTitle">Загрузка...</h2>
        
        <h3>Комментарии</h3>
        <div id="commentsList">Загрузка комментариев...</div>
    </div>
    
    <aside class="side-column">
        <h4>Рекомендуем</h4>
        <div id="recommendedList"></div>
    </aside>
</div>

<script>
const videoId = new URLSearchParams(window.location.search).get('v');

async function init() {
    if (!videoId) return;
    document.getElementById('player-container').innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allowfullscreen></iframe>`;
    
    loadVideoData();
    loadYouTubeComments(); // ВЫЗОВ ФУНКЦИИ КОММЕНТАРИЕВ
}

async function loadYouTubeComments() {
    try {
        // ЭТОТ ЗАПРОС ДОЛЖЕН ИДТИ НА ТВОЙ СЕРВЕР (server.js)
        // Сервер сам должен сделать запрос в YouTube API и вернуть JSON
        const res = await fetch(`/api/youtube/comments/${videoId}`);
        const comments = await res.json();
        
        const list = document.getElementById('commentsList');
        list.innerHTML = comments.map(c => `
            <div class="comment-item">
                <div style="color:var(--accent); font-weight:bold;">@${c.user}</div>
                <div style="font-size:14px; margin-top:5px;">${c.text}</div>
            </div>
        `).join('');
    } catch (e) {
        document.getElementById('commentsList').innerHTML = "Не удалось загрузить комментарии.";
    }
}

async function loadVideoData() {
    const res = await fetch('/api/youtube/trends');
    const videos = await res.json();
    const v = videos.find(x => x._id == videoId);
    if(v) document.getElementById('videoTitle').innerText = v.title;
    
    const list = document.getElementById('recommendedList');
    list.innerHTML = videos.slice(0, 6).map(v => `
        <div class="side-card" onclick="location.href='watch.html?v=${v._id}'">
            <img src="${v.thumbnail_url}" class="side-thumb">
            <div style="font-size:13px;">${v.title}</div>
        </div>
    `).join('');
}

init();
</script>
</body>
</html>
