<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VideoHub — Просмотр</title>
  
  <link rel="icon" type="image/png" href="uploads/IMG_5231.PNG">
  <link rel="shortcut icon" href="uploads/IMG_5231.PNG" type="image/x-icon">

  <style>
    :root {
      --bg: #11111a;
      --accent: #6b5cff;
      --text: #fff;
      --glass: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.1);
    }

    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; overflow-x: hidden;
    }

    .topbar {
      display: flex; align-items: center; padding: 12px 20px;
      background: var(--glass); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
    }

    .back-btn {
      background: var(--accent); border: none; color: white;
      padding: 8px 15px; border-radius: 8px; cursor: pointer; margin-right: 20px;
    }

    .container {
      display: flex; gap: 24px; padding: 20px; max-width: 1400px; margin: 0 auto;
    }

    .player-column { flex: 2.5; min-width: 0; }
    
    .video-wrapper video {
      width: 100%; border-radius: 16px; background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); outline: none;
    }

    .video-info { margin-top: 15px; }
    .video-title { font-size: 22px; font-weight: 700; margin-bottom: 10px; }

    .author-block {
      display: flex; align-items: center; gap: 12px; margin-top: 15px;
      padding: 15px; background: var(--glass); border-radius: 12px;
    }

    /* Аватарка автора */
    .author-avatar {
      width: 45px; height: 45px; border-radius: 50%;
      object-fit: cover; border: 1px solid var(--accent);
      background: #333;
    }

    .author-details b { font-size: 16px; display: block; }
    .author-details span { color: #aaa; font-size: 13px; }

    .side-column { flex: 1; display: flex; flex-direction: column; gap: 15px; }
    .side-title { font-size: 18px; font-weight: 600; margin-bottom: 10px; }

    .rec-card {
      display: flex; gap: 10px; cursor: pointer; transition: 0.2s;
      padding: 5px; border-radius: 8px;
    }
    .rec-card:hover { background: var(--glass); }
    .rec-thumb { width: 140px; aspect-ratio: 16/9; border-radius: 8px; object-fit: cover; }
    .rec-info h5 { margin: 0; font-size: 14px; color: #fff; }
    .rec-info p { margin: 3px 0 0; font-size: 12px; color: #aaa; }

    @media (max-width: 900px) {
      .container { flex-direction: column; }
      .side-column { width: 100%; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <button class="back-btn" onclick="location.href='index.html'">← Назад</button>
    <div style="font-weight:bold; font-size:20px;">Video<span>Hub</span></div>
  </header>

  <main class="container">
    <div class="player-column">
      <div class="video-wrapper">
        <video id="mainVideo" controls autoplay></video>
      </div>
      
      <div class="video-info">
        <div class="video-title" id="vTitle">Загрузка названия...</div>
        <div id="vViews" style="color:#aaa; font-size:14px;">0 просмотров</div>
        
        <div class="author-block">
          <img id="vAvatar" src="uploads/IMG_5231.PNG" class="author-avatar" onerror="this.src='uploads/IMG_5231.PNG'">
          <div class="author-details">
            <b id="vAuthor">Загрузка...</b>
            <span id="vDate">Дата не указана</span>
          </div>
        </div>
      </div>
    </div>

    <div class="side-column">
      <div class="side-title">Похожие видео</div>
      <div id="recommendations"></div>
    </div>
  </main>

  <script>
    const API_URL = "https://videohub-c48i.onrender.com";
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');

    async function loadVideo() {
      if (!videoId) return (location.href = 'index.html');

      try {
        // Получаем данные конкретного видео
        const res = await fetch(`${API_URL}/videos/${videoId}`);
        const video = await res.json();

        if (!video) throw new Error("Видео не найдено");

        // Ставим данные в плеер
        document.getElementById('mainVideo').src = video.url;
        document.getElementById('vTitle').innerText = video.title;
        document.getElementById('vAuthor').innerText = "@" + (video.author_name || "Аноним");
        document.getElementById('vViews').innerText = `${video.views || 0} просмотров`;
        
        // Установка аватарки автора (если нет — заглушка)
        if (video.author_avatar) {
            document.getElementById('vAvatar').src = video.author_avatar;
        }

        // Обновляем заголовок вкладки под видео
        document.title = `${video.title} — VideoHub`;

        // Сохраняем в историю (для мини-плеера на главной)
        localStorage.setItem('lastWatched', JSON.stringify({
            id: video._id,
            title: video.title,
            url: video.url,
            time: 0
        }));

        loadRecommendations();
      } catch (err) {
        console.error(err);
        alert("Ошибка при загрузке видео");
      }
    }

    async function loadRecommendations() {
      try {
        const res = await fetch(`${API_URL}/videos`);
        const all = await res.json();
        const container = document.getElementById('recommendations');
        
        // Фильтруем текущее видео из списка
        const filtered = all.filter(v => v._id !== videoId).slice(0, 10);

        container.innerHTML = filtered.map(v => `
          <div class="rec-card" onclick="location.href='watch.html?v=${v._id}'">
            <img src="${v.thumbnail_url || 'uploads/IMG_5231.PNG'}" class="rec-thumb" onerror="this.src='uploads/IMG_5231.PNG'">
            <div class="rec-info">
              <h5>${v.title}</h5>
              <p>@${v.author_name || 'Автор'}</p>
              <p style="font-size:11px;">👁 ${v.views || 0}</p>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error("Ошибка рекомендаций", e);
      }
    }

    // Следим за временем просмотра для сохранения позиции
    const videoElem = document.getElementById('mainVideo');
    videoElem.ontimeupdate = () => {
        const data = JSON.parse(localStorage.getItem('lastWatched'));
        if (data) {
            data.time = videoElem.currentTime;
            localStorage.setItem('lastWatched', JSON.stringify(data));
        }
    };

    window.onload = loadVideo;
  </script>
</body>
</html>
