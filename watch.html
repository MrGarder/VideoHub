<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VideoHub — Просмотр</title>
  <link rel="icon" type="image/png" href="uploads/IMG_5231.PNG">

  <style>
    :root {
      --bg: #11111a;
      --accent: #6b5cff;
      --text: #fff;
      --glass: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.1);
      --danger: #ff4e4e;
    }

    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
    .topbar { display: flex; align-items: center; padding: 12px 20px; background: var(--glass); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); sticky: top; z-index: 100; }
    .back-btn { background: var(--accent); border: none; color: white; padding: 8px 15px; border-radius: 8px; cursor: pointer; margin-right: 20px; }

    .container { display: flex; gap: 24px; padding: 20px; max-width: 1400px; margin: 0 auto; }
    .player-column { flex: 2.5; min-width: 0; }
    .video-wrapper video { width: 100%; border-radius: 16px; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

    .video-info { margin-top: 20px; }
    .video-title { font-size: 24px; font-weight: 700; }

    /* БЛОК ВЗАИМОДЕЙСТВИЯ (Лайки, Подписка) */
    .actions-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 15px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
    }
    
    .author-info { display: flex; align-items: center; gap: 12px; }
    .author-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent); }
    
    .subscribe-btn {
      background: #fff; color: #000; border: none; padding: 10px 20px;
      border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.3s;
    }
    .subscribe-btn.active { background: var(--glass); color: #fff; border: 1px solid var(--border); }

    .like-dislike-btns {
      display: flex; background: var(--glass); border-radius: 20px;
      overflow: hidden; border: 1px solid var(--border);
    }
    .btn-action {
      background: none; border: none; color: #fff; padding: 10px 18px;
      cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s;
    }
    .btn-action:hover { background: rgba(255,255,255,0.1); }
    .btn-action.active { color: var(--accent); }
    .btn-action:first-child { border-right: 1px solid var(--border); }

    .side-column { flex: 1; display: flex; flex-direction: column; gap: 15px; }
    .rec-card { display: flex; gap: 10px; cursor: pointer; padding: 5px; border-radius: 8px; }
    .rec-card:hover { background: var(--glass); }
    .rec-thumb { width: 140px; aspect-ratio: 16/9; border-radius: 8px; object-fit: cover; }

    @media (max-width: 900px) { .container { flex-direction: column; } }
  </style>
</head>
<body>

  <header class="topbar">
    <button class="back-btn" onclick="location.href='index.html'">← Назад</button>
    <div style="font-weight:bold; font-size:20px;">VideoHub</div>
  </header>

  <main class="container">
    <div class="player-column">
      <div class="video-wrapper">
        <video id="mainVideo" controls autoplay></video>
      </div>
      
      <div class="video-info">
        <div class="video-title" id="vTitle">Загрузка...</div>
        <div id="vViews" style="color:#aaa; font-size:14px; margin-top:5px;">0 просмотров</div>
        
        <div class="actions-bar">
          <div class="author-info">
            <img id="vAvatar" src="uploads/IMG_5231.PNG" class="author-avatar" onerror="this.src='uploads/IMG_5231.PNG'">
            <div>
              <b id="vAuthor">Загрузка...</b>
              <div id="subsCount" style="font-size:12px; color:#aaa;">0 подписчиков</div>
            </div>
            <button id="subBtn" class="subscribe-btn" onclick="toggleSub()">Подписаться</button>
          </div>

          <div class="like-dislike-btns">
            <button id="likeBtn" class="btn-action" onclick="handleLike('like')">
              👍 <span id="likesCount">0</span>
            </button>
            <button id="dislikeBtn" class="btn-action" onclick="handleLike('dislike')">
              👎
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="side-column">
      <div id="recommendations"></div>
    </div>
  </main>

  <script>
    const API_URL = "https://videohub-c48i.onrender.com";
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');
    const currentUser = localStorage.getItem('currentUser');

    async function loadVideo() {
      if (!videoId) return (location.href = 'index.html');
      try {
        const res = await fetch(`${API_URL}/videos/${videoId}`);
        const video = await res.json();

        document.getElementById('mainVideo').src = video.url;
        document.getElementById('vTitle').innerText = video.title;
        document.getElementById('vAuthor').innerText = "@" + (video.author_name || "Аноним");
        document.getElementById('vViews').innerText = `${video.views || 0} просмотров`;
        document.getElementById('likesCount').innerText = video.likes || 0;
        
        if (video.author_avatar) document.getElementById('vAvatar').src = video.author_avatar;

        loadRecommendations();
        updateViews();
      } catch (err) { console.error(err); }
    }

    async function updateViews() {
        fetch(`${API_URL}/videos/${videoId}/view`, { method: 'POST' });
    }

    async function handleLike(type) {
      if (!currentUser) return alert("Войдите, чтобы ставить лайки!");
      
      // Визуальный эффект сразу
      const lBtn = document.getElementById('likeBtn');
      const count = document.getElementById('likesCount');
      
      if (type === 'like') {
          lBtn.classList.toggle('active');
          let currentLikes = parseInt(count.innerText);
          count.innerText = lBtn.classList.contains('active') ? currentLikes + 1 : currentLikes - 1;
      }

      // Отправка на бэкенд
      await fetch(`${API_URL}/videos/${videoId}/like`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: currentUser, type: type })
      });
    }

    function toggleSub() {
      if (!currentUser) return alert("Войдите, чтобы подписаться!");
      const btn = document.getElementById('subBtn');
      btn.classList.toggle('active');
      btn.innerText = btn.classList.contains('active') ? "Вы подписаны" : "Подписаться";
    }

    async function loadRecommendations() {
      const res = await fetch(`${API_URL}/videos`);
      const all = await res.json();
      const container = document.getElementById('recommendations');
      container.innerHTML = all.filter(v => v._id !== videoId).slice(0, 8).map(v => `
        <div class="rec-card" onclick="location.href='watch.html?v=${v._id}'">
          <img src="${v.thumbnail_url || 'uploads/IMG_5231.PNG'}" class="rec-thumb">
          <div class="rec-info">
            <h5 style="margin:0; font-size:14px;">${v.title}</h5>
            <p style="margin:3px 0; font-size:12px; color:#aaa;">@${v.author_name}</p>
          </div>
        </div>
      `).join('');
    }

    window.onload = loadVideo;
  </script>
</body>
</html>
