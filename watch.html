<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VideoHub — Просмотр</title>
  <link rel="icon" type="image/png" href="uploads/IMG_5231.PNG">

  <style>
    :root {
      --bg: #0f0f17;
      --accent: #6b5cff;
      --text: #fff;
      --glass: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.1);
    }

    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
    
    .topbar { 
      display: flex; align-items: center; padding: 12px 20px; 
      background: rgba(15, 15, 23, 0.8); backdrop-filter: blur(12px); 
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; 
    }
    .back-btn { background: var(--glass); border: 1px solid var(--border); color: white; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-right: 20px; transition: 0.3s; }
    .back-btn:hover { background: var(--accent); }

    .container { display: flex; gap: 24px; padding: 20px; max-width: 1400px; margin: 0 auto; }
    .player-column { flex: 2.5; min-width: 0; }
    
    .video-wrapper video { width: 100%; border-radius: 12px; background: #000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

    .video-info { margin-top: 20px; }
    .video-title { font-size: 22px; font-weight: 700; }

    .actions-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 15px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
    }
    
    .author-info { display: flex; align-items: center; gap: 12px; }
    .author-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent); }
    
    .subscribe-btn {
      background: #fff; color: #000; border: none; padding: 10px 18px;
      border-radius: 20px; font-weight: 600; cursor: pointer;
    }

    .like-dislike-btns { display: flex; background: var(--glass); border-radius: 20px; border: 1px solid var(--border); }
    .btn-action { background: none; border: none; color: #fff; padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    /* КОММЕНТАРИИ */
    .comments-section { margin-top: 30px; }
    .comment-form { display: flex; gap: 12px; margin-bottom: 25px; }
    .comment-input {
      flex: 1; background: none; border: none; border-bottom: 1px solid var(--border);
      color: #fff; padding: 8px 0; outline: none; transition: 0.3s;
    }
    .comment-input:focus { border-bottom-color: var(--accent); }
    .send-comment-btn { background: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 18px; cursor: pointer; }

    .comment-item { display: flex; gap: 12px; margin-bottom: 20px; }
    .comment-avatar { width: 36px; height: 36px; border-radius: 50%; background: #333; }
    .comment-content b { font-size: 13px; color: var(--accent); }
    .comment-content p { margin: 4px 0 0; font-size: 14px; line-height: 1.4; }

    /* РЕКОМЕНДАЦИИ */
    .side-column { flex: 1; min-width: 350px; }
    .rec-card { display: flex; gap: 12px; cursor: pointer; margin-bottom: 12px; transition: 0.2s; border-radius: 8px; padding: 4px; }
    .rec-card:hover { background: var(--glass); }
    .rec-thumb { width: 160px; aspect-ratio: 16/9; border-radius: 8px; object-fit: cover; }
    .rec-info h5 { margin: 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .rec-info p { margin: 4px 0 0; font-size: 12px; color: #aaa; }

    @media (max-width: 1000px) { .container { flex-direction: column; } .side-column { width: 100%; } }
  </style>
</head>
<body>

  <header class="topbar">
    <button class="back-btn" onclick="location.href='index.html'">← На главную</button>
    <div style="font-weight:800; font-size:22px; letter-spacing:-1px;">VideoHub</div>
  </header>

  <main class="container">
    <div class="player-column">
      <div class="video-wrapper">
        <video id="mainVideo" controls autoplay></video>
      </div>
      
      <div class="video-info">
        <div class="video-title" id="vTitle">Загрузка названия...</div>
        <div id="vViews" style="color:#aaa; font-size:14px; margin-top:8px;">0 просмотров</div>
        
        <div class="actions-bar">
          <div class="author-info">
            <img id="vAvatar" src="uploads/IMG_5231.PNG" class="author-avatar" onerror="this.src='uploads/IMG_5231.PNG'">
            <div>
              <b id="vAuthor">Загрузка...</b>
              <div id="subsCount" style="font-size:12px; color:#aaa;">1.2к подписчиков</div>
            </div>
            <button class="subscribe-btn">Подписаться</button>
          </div>

          <div class="like-dislike-btns">
            <button class="btn-action" onclick="alert('Лайк поставлен!')">👍 <span id="likesCount">0</span></button>
            <button class="btn-action">👎</button>
          </div>
        </div>
      </div>

      <section class="comments-section">
        <h3 id="commHeader">Комментарии</h3>
        <div class="comment-form">
          <img src="uploads/IMG_5231.PNG" class="comment-avatar" id="myAvatar">
          <input type="text" class="comment-input" id="commentText" placeholder="Введите комментарий...">
          <button class="send-comment-btn" onclick="sendComment()">Отправить</button>
        </div>
        <div id="commentsList"></div>
      </section>
    </div>

    <aside class="side-column">
      <h4 style="margin-top:0;">Следующие видео</h4>
      <div id="recommendations"></div>
    </aside>
  </main>

  <script>
    const API_URL = "https://videohub-c48i.onrender.com";
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');
    const currentUser = localStorage.getItem('currentUser');

    async function loadVideo() {
      if (!videoId) return (location.href = 'index.html');
      try {
        const res = await fetch(`${API_URL}/videos/${videoId}`);
        const video = await res.json();

        document.getElementById('mainVideo').src = video.url;
        document.getElementById('vTitle').innerText = video.title;
        document.getElementById('vAuthor').innerText = "@" + (video.author_name || "Аноним");
        document.getElementById('vViews').innerText = `${video.views || 0} просмотров`;
        document.getElementById('likesCount').innerText = video.likes || 0;
        
        if (video.author_avatar) document.getElementById('vAvatar').src = video.author_avatar;

        loadComments();
        loadRecommendations();
      } catch (err) { console.error(err); }
    }

    async function loadComments() {
        const res = await fetch(`${API_URL}/videos/${videoId}/comments`);
        const comments = await res.json();
        const list = document.getElementById('commentsList');
        document.getElementById('commHeader').innerText = `Комментарии: ${comments.length}`;
        
        list.innerHTML = comments.map(c => `
            <div class="comment-item">
                <img src="${c.user_avatar || 'uploads/IMG_5231.PNG'}" class="comment-avatar">
                <div class="comment-content">
                    <b>@${c.username}</b>
                    <p>${c.text}</p>
                </div>
            </div>
        `).join('') || '<p style="color:#666">Комментариев пока нет. Будь первым!</p>';
    }

    async function sendComment() {
        const text = document.getElementById('commentText').value;
        if (!currentUser) return alert("Войдите в аккаунт!");
        if (!text.trim()) return;

        await fetch(`${API_URL}/videos/${videoId}/comment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: currentUser, text: text })
        });

        document.getElementById('commentText').value = "";
        loadComments();
    }

    async function loadRecommendations() {
      const res = await fetch(`${API_URL}/videos`);
      const all = await res.json();
      const container = document.getElementById('recommendations');
      container.innerHTML = all.filter(v => v._id !== videoId).slice(0, 10).map(v => `
        <div class="rec-card" onclick="location.href='watch.html?v=${v._id}'">
          <img src="${v.thumbnail_url || 'uploads/IMG_5231.PNG'}" class="rec-thumb">
          <div class="rec-info">
            <h5>${v.title}</h5>
            <p>@${v.author_name}</p>
            <p style="opacity:0.6;">👁 ${v.views || 0}</p>
          </div>
        </div>
      `).join('');
    }

    window.onload = loadVideo;
  </script>
</body>
</html>
