<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>VideoHub — Просмотр</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --bg1: #1e1e2f; --glass: rgba(255,255,255,0.04); --text: #fff; --accent-solid: #6b5cff; --muted: rgba(255,255,255,0.7); }
    html,body{height:100%;margin:0;font-family:Inter, Arial, sans-serif;background: linear-gradient(135deg,#11111a,#1b1630);color:var(--text);}
    .logo { font-size: 24px; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, #fff 30%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .topbar{display:flex;align-items:center;justify-content: space-between;padding:12px 20px;background:var(--glass);border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:20;backdrop-filter: blur(10px);}
    .container{display:flex;gap:24px;padding:20px;max-width:1400px;margin:0 auto}
    .player-column{flex:2.5;min-width:0}
    .side-column{flex: 1; max-width: 400px; background: rgba(255,255,255,0.02); border-radius: 16px; padding: 16px; border: 1px solid rgba(255,255,255,0.05); height: fit-content; position: sticky; top: 85px; }
    #player-container { width:100%; border-radius:16px; background:black; aspect-ratio: 16/9; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    #player-container iframe { width: 100%; height: 100%; border: none; }
    .side-card{display:flex;gap:12px;padding:10px;border-radius:12px;cursor:pointer;transition: 0.2s; align-items: flex-start; margin-bottom: 4px;}
    .side-card:hover{background:rgba(255,255,255,0.06)}
    .side-thumb-wrapper{width:160px;height:90px;border-radius:10px;overflow: hidden; flex-shrink:0; background: #000;}
    .side-thumb{width:100%;height:100%;object-fit:cover;}
    @media (max-width: 1000px) { .container { flex-direction: column; } .side-column { position: static; } }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button onclick="history.back()" style="background:rgba(255,255,255,0.1); border:none; color:white; padding:8px 12px; border-radius:8px; cursor:pointer;">← Назад</button>
    <div class="logo" onclick="location.href='index.html'">Video<span>Hub</span></div>
  </div>
</div>

<div class="container">
  <div class="player-column">
    <div id="player-container"></div>
    <h2 id="videoTitle" style="margin-top:16px;">Загрузка...</h2>
    <div id="videoStats" style="color:var(--muted); font-size:14px;"></div>
    <div class="desc" id="descText" style="margin-top:20px; background:rgba(255,255,255,0.03); padding:15px; border-radius:12px;"></div>
  </div>
  <aside class="side-column">
    <h4>Рекомендуем</h4>
    <div id="recommendedList"></div>
  </aside>
</div>

<script>
const urlParams = new URLSearchParams(location.search);
const videoId = urlParams.get('v');

async function initWatchPage() {
    if (!videoId) return location.href = 'index.html';

    // Рендерим плеер
    document.getElementById('player-container').innerHTML = `
        <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allowfullscreen></iframe>
    `;

    try {
        // Загружаем данные
        const [localRes, trendRes] = await Promise.all([
            fetch('/videos').then(r => r.json()).catch(() => []),
            fetch('/api/youtube/trends').then(r => r.json()).catch(() => [])
        ]);
        
        const allVideos = [...localRes, ...trendRes];
        let v = allVideos.find(x => x._id == videoId || x.id == videoId);

        if (v) {
            // Безопасное извлечение данных (поддерживает и твой формат, и YouTube API)
            const title = v.title || (v.snippet ? v.snippet.title : "Видео");
            const desc = v.description || (v.snippet ? v.snippet.description : "Нет описания");
            const author = v.author_name || (v.snippet ? v.snippet.channelTitle : "Автор");
            const views = v.views || "0";

            document.getElementById('videoTitle').innerText = title;
            document.getElementById('descText').innerText = desc;
            document.getElementById('videoStats').innerText = `${views} просмотров`;
        }

        // Рендер рекомендаций
        const list = document.getElementById('recommendedList');
        list.innerHTML = allVideos.filter(x => (x._id || x.id) != videoId).slice(0, 8).map(v => `
            <div class="side-card" onclick="location.href='watch.html?v=${v._id || v.id}'">
                <div class="side-thumb-wrapper">
                    <img src="${v.thumbnail_url || (v.snippet?.thumbnails?.default?.url)}" class="side-thumb">
                </div>
                <div class="side-info">
                    <div style="font-size:14px; font-weight:600;">${v.title || v.snippet?.title}</div>
                    <div style="font-size:12px; color:var(--muted);">${v.author_name || v.snippet?.channelTitle}</div>
                </div>
            </div>
        `).join('');

    } catch (e) { console.error("Ошибка загрузки данных:", e); }
}

window.onload = initWatchPage;
</script>
</body>
</html>ф
