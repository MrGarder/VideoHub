<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>VideoHub — Профиль</title>
  <style>
    :root { --accent: #8b5cf6; --bg: #0d0b14; --text: #e5e1ff; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: #0b0912; color: var(--text); min-height: 100vh; }
    .topbar { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(13,11,20,0.8); backdrop-filter: blur(10px); display: flex; align-items: center; padding: 0 20px; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .back-btn { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 8px; cursor: pointer; }
    .banner-container { position: relative; height: 250px; background: #1a1a1a; margin-top: 60px; }
    #bannerImg { width: 100%; height: 100%; object-fit: cover; }
    .profile-header { display: flex; align-items: flex-end; gap: 20px; padding: 0 40px; transform: translateY(-40px); }
    #userAvatar { width: 130px; height: 130px; border-radius: 50%; border: 5px solid #0b0912; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; padding: 20px 40px; }
    .video-card { position: relative; background: rgba(255,255,255,0.03); border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
    .btn { padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; }
    .btn-upload { background: var(--accent); color: white; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; }
    .modal-content { background:#1a1629; padding:30px; border-radius:20px; width:90%; max-width:400px; }
    input { width: 100%; padding: 12px; margin: 8px 0; background: #0c0a16; border: 1px solid #222; color: #fff; border-radius: 10px; }
  </style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html'">← На главную</button>
</div>

<div class="banner-container">
  <img id="bannerImg" src="https://i.imgur.com/YcZpYh4.jpeg">
</div>

<div class="profile-header">
  <div id="userAvatar">?</div>
  <div class="user-info">
    <h1 id="displayUsername">Загрузка...</h1>
    <p style="color:#888" id="videoStats">...</p>
  </div>
  <div class="controls" id="profileControls"></div>
</div>

<div class="grid" id="myVideos"></div>

<div id="editModal" class="modal"><div class="modal-content">
  <h3>Настройки канала</h3>
  <input type="text" id="newName" placeholder="Имя профиля">
  <label>Аватар</label><input type="file" id="avatarInput" accept="image/*">
  <label>Баннер</label><input type="file" id="bannerInput" accept="image/*">
  <button class="btn btn-upload" onclick="saveProfile()" style="width:100%">Сохранить</button>
</div></div>

<script>
  const currentUser = localStorage.getItem('currentUser');
  const urlParams = new URLSearchParams(location.search);
  const targetUser = urlParams.get('user') || currentUser;

  async function load() {
    const [local, youtube, sub, profile] = await Promise.all([
      fetch('/videos').then(r => r.json().catch(() => [])),
      fetch('/api/youtube/trends').then(r => r.json().catch(() => [])),
      fetch(`/subscribe/count/${targetUser}`).then(r => r.json()),
      fetch(`/user/profile/${targetUser}`).then(r => r.json())
    ]);

    const userVideos = [...local, ...youtube].filter(v => v.author_name === targetUser);
    document.getElementById('displayUsername').innerText = profile.name || targetUser;
    if(profile.avatar) document.getElementById('userAvatar').style.backgroundImage = `url(${profile.avatar})`;
    if(profile.banner) document.getElementById('bannerImg').src = profile.banner;
    
    // ... остальная логика отрисовки видео (как у вас) ...
  }

  async function saveProfile() {
    const formData = new FormData();
    formData.append('username', currentUser);
    formData.append('name', document.getElementById('newName').value);
    if(document.getElementById('avatarInput').files[0]) formData.append('avatar', document.getElementById('avatarInput').files[0]);
    if(document.getElementById('bannerInput').files[0]) formData.append('banner', document.getElementById('bannerInput').files[0]);

    const res = await fetch('/user/update-profile', { method: 'POST', body: formData });
    if(res.ok) { alert('Обновлено!'); location.reload(); }
  }

  window.onload = load;
</script>
</body>
</html>
